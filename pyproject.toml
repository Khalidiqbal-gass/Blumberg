[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blumberg-market-radar"
version = "0.1.0"
description = "Research tools for early-rally discovery in Indian equities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "requests>=2.31.0",
    "yfinance>=0.2.40",
    "plotly>=5.20.0",
    "matplotlib>=3.8"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
dashboard = ["streamlit>=1.38", "plotly>=5.20.0", "matplotlib>=3.8"]
ml = ["scikit-learn>=1.5", "lightgbm>=4.4", "xgboost>=2.1"]
news = ["beautifulsoup4>=4.12", "pypdf>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
